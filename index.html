<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Admin - User Management</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <i class="fas fa-robot"></i>
        <span>LMS Admin</span>
      </div>
      <nav class="nav-menu">
        <a href="#" class="nav-item active" data-view="users">
          <i class="fas fa-users"></i>
          <span>Users</span>
        </a>
        <a href="#" class="nav-item" data-view="classes">
          <i class="fas fa-book"></i>
          <span>Classes</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <p>MongoDB Manager</p>
        <small>v1.0.0</small>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <h1 id="page-title">User Management</h1>
          <span class="badge" id="user-count">0 users</span>
        </div>
        <div class="header-right">
          <button class="btn btn-primary" id="add-user-btn">
            <i class="fas fa-plus"></i>
            Add User
          </button>
        </div>
      </header>

      <!-- Users View -->
      <div id="users-view" class="view active">
        <div class="search-bar">
          <i class="fas fa-search"></i>
          <input type="text" id="search-input" placeholder="Search users by username or name...">
        </div>
        
        <div class="users-grid" id="users-container">
          <!-- Users will be loaded here -->
        </div>
      </div>

      <!-- Classes View -->
      <div id="classes-view" class="view">
        <div class="classes-info">
          <h2>Available Classes</h2>
          <p>These are the classes that can be assigned to users. Toggle them ON/OFF in user settings.</p>
        </div>
        <div class="classes-list" id="classes-container">
          <!-- Classes will be loaded here -->
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit User Modal -->
  <div class="modal-overlay" id="user-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add New User</h2>
        <button class="modal-close" id="modal-close">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <form id="user-form">
        <input type="hidden" id="user-id">
        <div class="form-group">
          <label for="username">Username *</label>
          <input type="text" id="username" required placeholder="Enter username">
        </div>
        <div class="form-group">
          <label for="fullname">Full Name *</label>
          <input type="text" id="fullname" required placeholder="Enter full name">
        </div>
        <div class="form-group">
          <label for="age">Age</label>
          <input type="number" id="age" placeholder="Enter age" min="0">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input">
            <input type="password" id="password" placeholder="Enter password (default: 123456789)">
            <button type="button" class="toggle-password" id="toggle-password">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        
        <!-- Class Toggles -->
        <div class="form-group">
          <label>Assign Classes</label>
          <div class="class-toggles" id="class-toggles">
            <!-- Class toggles will be generated here -->
          </div>
        </div>
        
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save"></i>
            <span id="submit-text">Save User</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Confirm Delete</h2>
        <button class="modal-close" id="delete-modal-close">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete user <strong id="delete-username"></strong>?</p>
        <p class="warning">This action cannot be undone.</p>
      </div>
      <div class="form-actions">
        <button class="btn btn-secondary" id="delete-cancel">Cancel</button>
        <button class="btn btn-danger" id="delete-confirm">
          <i class="fas fa-trash"></i>
          Delete
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notifications -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Loading Spinner -->
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
